name: Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "GodotProject/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Validate Godot project and export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          # sdkmanager may close the pipe after accepting all licenses; ignore yes(1)'s SIGPIPE only.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.7.2 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test -f "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "Godot executable prepared at $GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import and validate project
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path GodotProject --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$RUNNER_TEMP/godot-import.log"; then
            echo "Godot script validation failed"
            exit 1
          fi

      - name: Probe imported character rigs and animation libraries
        run: |
          "$GODOT_BIN" --headless --path GodotProject --script res://tools/asset_probe.gd

      - name: Run campaign gameplay smoke test
        run: |
          "$GODOT_BIN" --headless --path GodotProject --script res://tools/game_smoke_test.gd

      - name: Export Android debug APK
        run: |
          mkdir -p GodotProject/build
          "$GODOT_BIN" --headless --path GodotProject --export-debug "Android" build/KAVEH-RISING-debug.apk

      - name: Verify APK package, payload and Android launch entry
        shell: bash
        run: |
          set -euo pipefail
          APK="GodotProject/build/KAVEH-RISING-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000000
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fqx "assets/main.pck" "$RUNNER_TEMP/apk-files.txt"
          grep -Fqx "lib/arm64-v8a/libgodot_android.so" "$RUNNER_TEMP/apk-files.txt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "package: name='org.kavehrising.game'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "^launchable-activity:" "$RUNNER_TEMP/apk-badging.txt"
          echo "APK verified: $(stat -c%s "$APK") bytes; package, arm64-v8a library, game payload and launcher entry present."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KAVEH-RISING-Android-debug
          path: GodotProject/build/KAVEH-RISING-debug.apk
          if-no-files-found: error
          retention-days: 14
